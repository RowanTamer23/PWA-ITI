<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Wrong URL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #0d1117 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; color: #eccc68; }
        p { font-size: 1.2rem; color: #a4b0be; margin-bottom: 2rem; }
        a {
            padding: 12px 24px;
            background: #2f3542;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        a:hover { background: #57606f; }
    </style>
</head>
<body>
    <h1>Wrong URL</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="index.html">Go to Home Page</a>
</body>
</html>
